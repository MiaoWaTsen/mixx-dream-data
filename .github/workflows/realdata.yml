# Scrapes NMIXX's real tour dates and music show wins from Wikipedia into realdata.json for MIXX-DREAM.
# Twice a day (11:00 and 23:00 Taiwan time); Actions → realdata → Run workflow runs it right away.
name: realdata
on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scrape.mjs realdata.json
      - name: Commit if changed
        run: |
          git config user.name "mixx-dream-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realdata.json
          git diff --cached --quiet || (git commit -m "data: update realdata.json" && git pull --rebase && git push)
